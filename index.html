<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARACHE - Solusi Skripsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        
        /* Judul CARACHE Khusus Mobile Android */
        @media (max-width: 768px) {
            .mobile-title { visibility: hidden; position: relative; }
            .mobile-title::after {
                content: "CARACHE";
                visibility: visible;
                position: absolute; left: 0; right: 0; top: 0;
                text-align: center; font-weight: bold; color: #ea580c;
            }
        }
    </style>
</head>
<body class="pb-20">
    <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold text-primary-600 mobile-title">Skripsi Assistant</h1>
            <span class="bg-primary-50 text-primary-600 px-3 py-1 rounded-full text-xs font-bold">V 2.0</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
        <section class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 mobile-title">🎓 Thesis Generator</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Pilih Program Studi</label>
                    <select id="prodi-input" class="w-full p-3 rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="Teknologi Informasi">Teknologi Informasi</option>
                        <option value="Ekonomi">Ekonomi & Bisnis</option>
                        <option value="Hukum">Hukum</option>
                        <option value="Kesehatan">Kesehatan</option>
                        <option value="Pendidikan">Pendidikan</option>
                    </select>
                </div>
                <button onclick="generateTitle()" class="w-full py-4 bg-primary-600 text-white rounded-2xl font-bold hover:bg-primary-700 shadow-lg transition-all">
                    Generate Judul
                </button>
                <div id="generated-title-result" class="hidden p-4 bg-primary-50 rounded-2xl border border-primary-100 text-primary-700 font-medium italic text-center"></div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 mobile-title">🔥 Hot Topics Finder</h2>
            <div class="space-y-4">
                <input type="text" id="title-input" placeholder="Masukkan topik manual..." 
                    class="w-full p-4 rounded-2xl border border-gray-200 bg-gray-50 outline-none focus:ring-2 focus:ring-primary-500">
                
                <button onclick="findHotTopics()" class="w-full py-3 bg-dark-800 text-white rounded-2xl font-semibold hover:bg-dark-900 transition-all">
                    Cari Research Gaps
                </button>

                <div id="hotTopicsList" class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4"></div>
            </div>
        </section>
    </main>

    <div id="topicModal" class="fixed inset-0 bg-black/50 z-[9999] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl border border-orange-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔍</div>
                <h3 id="modalTopicTitle" class="text-lg font-bold text-gray-900 px-2">Topik</h3>
            </div>
            
            <div class="space-y-3">
                <button onclick="searchJournals()" class="w-full py-3 px-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-orange-500 flex items-center gap-3">
                    <span class="text-xl">📚</span><span class="text-sm font-bold text-gray-700">Google Scholar</span>
                </button>
                <button onclick="searchLinkedIn()" class="w-full py-3 px-4 bg-blue-50 border-2 border-blue-100 rounded-2xl hover:border-blue-600 flex items-center gap-3">
                    <span class="text-xl">🔗</span><span class="text-sm font-bold text-blue-700">LinkedIn Posts</span>
                </button>
                <button onclick="searchYouTube()" class="w-full py-3 px-4 bg-red-50 border-2 border-red-100 rounded-2xl hover:border-red-600 flex items-center gap-3">
                    <span class="text-xl">▶️</span><span class="text-sm font-bold text-red-700">YouTube Videos</span>
                </button>
                <button onclick="searchSocialMedia()" class="w-full py-3 px-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-blue-400 flex items-center gap-3">
                    <span class="text-xl">🐦</span><span class="text-sm font-bold text-gray-700">Twitter / X</span>
                </button>
            </div>
            
            <button onclick="closeModal()" class="mt-6 w-full py-2 text-gray-400 text-xs hover:text-red-500">Tutup</button>
        </div>
    </div>

    <script>
        let selectedTopic = "";

        function generateTitle() {
            const prodi = document.getElementById('prodi-input').value;
            const res = document.getElementById('generated-title-result');
            const manual = document.getElementById('title-input');
            const judul = `Optimalisasi Layanan ${prodi} Berbasis Digital di Era Modern`;
            res.innerText = judul;
            res.classList.remove('hidden');
            manual.value = judul;
        }

        // FUNGSI INTI: Memperbaiki Bug History
        function findHotTopics() {
            const list = document.getElementById('hotTopicsList');
            const input = document.getElementById('title-input').value;
            const prodi = document.getElementById('prodi-input').value;

            // FIX UTAMA: Kosongkan list total sebelum generate kartu baru
            list.innerHTML = '';

            if (!input.trim()) {
                alert('Masukkan topik dulu!');
                return;
            }

            const database = {
                "Teknologi Informasi": ["Cyber Security", "AI Integration", "Big Data", "Blockchain"],
                "Ekonomi": ["Digital Marketing", "Fintech", "E-commerce Strategy", "Startup Growth"],
                "Hukum": ["Cyber Law", "Data Privacy", "Digital HAKI", "Consumer Protection"],
                "Kesehatan": ["Telemedicine", "E-Health", "Medical AI", "Health Privacy"],
                "Pendidikan": ["E-Learning", "LMS Innovation", "Hybrid Schooling", "Digital Pedagogy"]
            };

            const gaps = database[prodi] || database["Teknologi Informasi"];

            gaps.forEach((topic, i) => {
                const card = document.createElement('div');
                card.className = "p-4 bg-white border border-gray-100 rounded-2xl hover:border-orange-500 cursor-pointer shadow-sm transition-all";
                card.onclick = () => showTopicModal(topic);
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-[10px] font-bold">${i+1}</span>
                        <p class="text-sm font-semibold text-gray-700">${topic}</p>
                    </div>`;
                list.appendChild(card);
            });
        }

        function showTopicModal(topic) {
            selectedTopic = topic;
            document.getElementById('modalTopicTitle').innerText = topic;
            document.getElementById('topicModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('topicModal').classList.add('hidden'); }

        // Fungsi Pencarian
        function searchJournals() { window.open(`https://scholar.google.com/scholar?q=${encodeURIComponent(selectedTopic)}`, '_blank'); }
        function searchLinkedIn() { window.open(`https://www.linkedin.com/search/results/content/?keywords=${encodeURIComponent(selectedTopic)}`, '_blank'); }
        function searchYouTube() { window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(selectedTopic)}`, '_blank'); }
        function searchSocialMedia() { window.open(`https://twitter.com/search?q=${encodeURIComponent(selectedTopic)}`, '_blank'); }
    </script>
</body>
</html>
