<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARACHE - Solusi Skripsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        /* Tampilan CARACHE untuk Android */
        @media (max-width: 768px) {
            .mobile-title { visibility: hidden; position: relative; }
            .mobile-title::after {
                content: "CARACHE";
                visibility: visible;
                position: absolute; left: 0; right: 0; top: 0;
                text-align: center; color: #ea580c; font-weight: bold;
            }
        }
    </style>
</head>
<body class="pb-10">
    <header class="bg-white border-b p-4 mb-6">
        <h1 class="text-xl font-bold text-orange-600 text-center mobile-title">Skripsi Assistant</h1>
    </header>

    <main class="max-w-2xl mx-auto px-4 space-y-6">
        <section class="bg-white p-6 rounded-3xl shadow-sm border">
            <h2 class="font-bold mb-4 mobile-title">Thesis Generator</h2>
            <select id="prodi-input" class="w-full p-3 mb-4 rounded-xl border outline-none">
                <option value="Teknologi Informasi">Teknologi Informasi</option>
                <option value="Ekonomi">Ekonomi</option>
                <option value="Hukum">Hukum</option>
                <option value="Kesehatan">Kesehatan</option>
                <option value="Pendidikan">Pendidikan</option>
            </select>
            <button onclick="generateJudul()" class="w-full py-3 bg-orange-600 text-white rounded-xl font-bold">Generate Judul</button>
            <div id="hasil-judul" class="mt-4 p-4 bg-orange-50 text-orange-700 rounded-xl hidden italic font-medium"></div>
        </section>

        <section class="bg-white p-6 rounded-3xl shadow-sm border">
            <h2 class="font-bold mb-4 mobile-title">Hot Topic Finder</h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="title-input" placeholder="Ketik topik manual di sini..." 
                    class="w-full p-3 rounded-xl border bg-gray-50 focus:border-orange-500 outline-none">
                
                <button onclick="findHotTopics()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">
                    Cari Research Gaps
                </button>
            </div>

            <div id="hotTopicsList" class="mt-6 space-y-3">
                </div>
        </section>
    </main>

    <script>
        // Data Gaps per Prodi
        const dataGaps = {
            "Teknologi Informasi": ["Keamanan Cyber AI", "Privasi Data Cloud", "Blockchain Implementation"],
            "Ekonomi": ["Fintech Adoption", "Digital Marketing ROI", "Startup Sustainability"],
            "Hukum": ["Regulasi AI", "Hukum Siber Nasional", "Perlindungan Konsumen Digital"],
            "Kesehatan": ["Telehealth Accuracy", "Electronic Medical Records", "Digital Health Ethics"],
            "Pendidikan": ["E-Learning Engagement", "Gamification in Classroom", "Hybrid Learning Model"]
        };

        function generateJudul() {
            const prodi = document.getElementById('prodi-input').value;
            const output = document.getElementById('hasil-judul');
            const inputManual = document.getElementById('title-input');
            
            const hasil = `Analisis Strategis ${prodi} di Era Digital`;
            output.innerText = hasil;
            output.classList.remove('hidden');
            inputManual.value = hasil; // Kirim ke input manual
        }

        // FUNGSI INTI UNTUK FIX BUG HISTORY
        function findHotTopics() {
            const listContainer = document.getElementById('hotTopicsList');
            const inputUser = document.getElementById('title-input').value;
            const prodiTerpilih = document.getElementById('prodi-input').value;

            // FIX: Hapus total isi list sebelum generate yang baru
            listContainer.innerHTML = '';

            if (inputUser.trim() === "") {
                alert("Mohon isi topik dulu!");
                return;
            }

            // Ambil data berdasarkan prodi
            const gaps = dataGaps[prodiTerpilih] || dataGaps["Teknologi Informasi"];

            // Munculkan hasil baru saja
            gaps.forEach((gap, index) => {
                const item = document.createElement('div');
                item.className = "p-4 bg-white border border-gray-200 rounded-2xl shadow-sm flex gap-3 items-center";
                item.innerHTML = `
                    <span class="w-7 h-7 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-xs font-bold">${index + 1}</span>
                    <p class="text-sm font-semibold text-gray-700">${gap}</p>
                `;
                listContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>
