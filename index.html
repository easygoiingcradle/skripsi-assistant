<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARACHE - Solusi Judul Skripsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        
        /* Fitur CARACHE untuk Tampilan Android/Mobile */
        @media (max-width: 768px) {
            .mobile-title { visibility: hidden; position: relative; }
            .mobile-title::after {
                content: "CARACHE";
                visibility: visible;
                position: absolute;
                left: 0; right: 0; top: 0;
                text-align: center;
                font-weight: bold;
                color: #ea580c;
            }
        }
    </style>
</head>
<body class="pb-20">
    <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold text-primary-600 mobile-title">Skripsi Assistant</h1>
            <div class="flex gap-2">
                <span class="bg-primary-50 text-primary-600 px-3 py-1 rounded-full text-xs font-bold">V 2.0</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
        <section class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 mobile-title">
                <span>🎓</span> Thesis Title Generator
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Pilih Program Studi</label>
                    <select id="prodi-input" class="w-full p-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                        <option value="Teknologi Informasi">Teknologi Informasi</option>
                        <option value="Ekonomi">Ekonomi & Bisnis</option>
                        <option value="Hukum">Hukum</option>
                        <option value="Kesehatan">Kesehatan</option>
                        <option value="Pendidikan">Pendidikan</option>
                    </select>
                </div>
                <button onclick="generateTitle()" class="w-full py-4 bg-primary-600 text-white rounded-2xl font-bold hover:bg-primary-700 transition-all shadow-lg shadow-primary-100">
                    Generate Judul Sekarang
                </button>
                <div id="generated-title-result" class="hidden p-4 bg-primary-50 rounded-2xl border border-primary-100 text-primary-700 font-medium italic text-center">
                    </div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 mobile-title">
                <span>🔥</span> Hot Topics Finder
            </h2>
            <div class="space-y-4">
                <input type="text" id="title-input" placeholder="Masukkan topik atau judul secara manual..." 
                    class="w-full p-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-primary-500 outline-none transition-all bg-gray-50">
                
                <button onclick="findHotTopics()" class="w-full py-3 bg-dark-800 text-white rounded-2xl font-semibold hover:bg-dark-900 transition-all">
                    Cari Research Gaps
                </button>

                <div id="hotTopicsList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    </div>
            </div>
        </section>
    </main>

    <div id="topicModal" class="fixed inset-0 bg-black/50 z-[9999] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl transform transition-all border border-orange-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔍</div>
                <h3 class="text-xl font-bold text-gray-900">Eksplorasi Topik</h3>
                <p id="modalTopicTitle" class="text-sm text-gray-500 mt-2 italic font-medium">"Topik"</p>
            </div>
            
            <div class="space-y-3">
                <button onclick="searchJournals()" class="w-full py-3 px-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-orange-500 transition-all flex items-center gap-3">
                    <span class="text-xl">📚</span>
                    <div class="text-left"><p class="text-sm font-bold">Google Scholar</p></div>
                </button>
                
                <button onclick="searchSocialMedia()" class="w-full py-3 px-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-blue-400 transition-all flex items-center gap-3">
                    <span class="text-xl">🐦</span>
                    <div class="text-left"><p class="text-sm font-bold">Twitter / X</p></div>
                </button>

                <button onclick="searchLinkedIn()" class="w-full py-3 px-4 bg-blue-50 border-2 border-blue-100 rounded-2xl hover:border-blue-600 transition-all flex items-center gap-3">
                    <span class="text-xl">🔗</span>
                    <div class="text-left"><p class="text-sm font-bold text-blue-700">LinkedIn</p></div>
                </button>

                <button onclick="searchYouTube()" class="w-full py-3 px-4 bg-red-50 border-2 border-red-100 rounded-2xl hover:border-red-600 transition-all flex items-center gap-3">
                    <span class="text-xl">▶️</span>
                    <div class="text-left"><p class="text-sm font-bold text-red-700">YouTube</p></div>
                </button>
            </div>
            
            <button onclick="closeModal()" class="mt-6 w-full py-2 text-gray-400 text-sm hover:text-red-500 transition-colors">Tutup</button>
        </div>
    </div>

    <script>
        let selectedTopic = "";

        // Fungsi Generate Judul Sederhana
        function generateTitle() {
            const prodi = document.getElementById('prodi-input').value;
            const resultBox = document.getElementById('generated-title-result');
            const titleInput = document.getElementById('title-input');
            
            let judul = `Analisis Implementasi Digital di Bidang ${prodi} pada Era 5.0`;
            
            resultBox.innerText = judul;
            resultBox.classList.remove('hidden');
            titleInput.value = judul; // Otomatis isi ke Hot Topics Finder
        }

        // FUNGSI HOT TOPICS (FIXED BUG HISTORY)
        function findHotTopics() {
            const hotTopicsList = document.getElementById('hotTopicsList');
            const titleValue = document.getElementById('title-input').value;
            const prodi = document.getElementById('prodi-input').value;

            // 1. KOSONGKAN LIST SEBELUM PROSES (HAPUS HISTORY)
            hotTopicsList.innerHTML = '';

            if (!titleValue.trim()) {
                alert('Silakan isi judul atau topik terlebih dahulu!');
                return;
            }

            // Database Sederhana
            const database = {
                "Teknologi Informasi": ["Keamanan Cloud", "AI Ethics", "Big Data Analytics", "IoT Security"],
                "Ekonomi": ["E-commerce Trends", "Fintech Regulation", "Digital Marketing", "Startup Pivot"],
                "Hukum": ["Cyber Crime Law", "Data Privacy", "Hukum E-commerce", "Digital Copyright"],
                "Kesehatan": ["Telemedicine", "Health Data Privacy", "AI in Diagnosis", "Digital Health Records"],
                "Pendidikan": ["Hybrid Learning", "Gamification", "LMS Efficiency", "AI in Education"]
            };

            const results = database[prodi] || database["Teknologi Informasi"];

            // 2. TAMPILKAN HASIL BARU
            results.forEach((topic, index) => {
                const card = document.createElement('div');
                card.className = 'p-4 border border-gray-100 rounded-2xl hover:border-orange-500 transition-all cursor-pointer bg-white shadow-sm';
                card.onclick = () => showTopicModal(topic);
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 flex items-center justify-center bg-orange-100 text-orange-600 rounded-full text-xs font-bold">${index + 1}</span>
                        <p class="text-sm font-medium text-gray-700">${topic}</p>
                    </div>
                `;
                hotTopicsList.appendChild(card);
            });
        }

        // Fungsi Modal & Search
        function showTopicModal(topic) {
            selectedTopic = topic;
            document.getElementById('modalTopicTitle').innerText = topic;
            document.getElementById('topicModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('topicModal').classList.add('hidden');
        }

        function searchJournals() { window.open(`https://scholar.google.com/scholar?q=${encodeURIComponent(selectedTopic)}`, '_blank'); }
        function searchSocialMedia() { window.open(`https://twitter.com/search?q=${encodeURIComponent(selectedTopic)}`, '_blank'); }
        function searchLinkedIn() { window.open(`https://www.linkedin.com/search/results/content/?keywords=${encodeURIComponent(selectedTopic)}`, '_blank'); }
        function searchYouTube() { window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(selectedTopic)}`, '_blank'); }
    </script>
</body>
</html>
